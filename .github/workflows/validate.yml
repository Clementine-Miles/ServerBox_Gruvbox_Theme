name: Validate and pack ServerBox themes

on:
  workflow_dispatch:
    inputs:
      verify_public_assets:
        description: Verify published assets against the existing listing records
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full schema checker
        run: python -m pip install check-jsonschema==0.38.2
      - name: Validate and pack previews
        env:
          VERIFY_PUBLIC: ${{ inputs.verify_public_assets }}
        run: |
          args=(--preview-dir "$RUNNER_TEMP/gruvbox-validated")
          if [[ "$VERIFY_PUBLIC" == true ]]; then
            args+=(--verify-public-assets)
          fi
          python tools/release_check.py "${args[@]}"
      - name: Upload validated previews
        uses: actions/upload-artifact@v4
        with:
          name: gruvbox-previews
          path: ${{ runner.temp }}/gruvbox-validated/
          if-no-files-found: error
